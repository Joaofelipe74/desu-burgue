<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Desu Burguer - Hambúrguer artesanal em Cristino Castro - PI" />
  <title>Desu Burguer | O sabor que merece seu próximo pedido</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #100f0d;
      --bg-2: #181512;
      --card: #211d18;
      --card-2: #2b241c;
      --orange: #f59e0b;
      --orange-2: #ea580c;
      --red: #ef4444;
      --green: #22c55e;
      --text: #fff7ed;
      --muted: #b8aaa0;
      --border: rgba(255,255,255,.1);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 80% 0%, rgba(245,158,11,.12), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      background: var(--orange-2);
      text-align: center;
      padding: 9px 16px;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    header {
      position: sticky;
      z-index: 30;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(16,15,13,.82);
      backdrop-filter: blur(18px);
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Poppins, sans-serif;
      font-size: 20px;
      white-space: nowrap;
    }

    .logo-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
      box-shadow: 0 8px 25px rgba(234,88,12,.35);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--orange);
    }

    .cart-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      color: #24150a;
      background: var(--orange);
      font-weight: 800;
      transition: .2s;
    }

    .cart-button:hover {
      transform: translateY(-2px);
      background: #fbbf24;
    }

    .cart-count {
      display: grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--red);
      color: white;
      font-size: 12px;
    }

    .mobile-button {
      display: none;
      color: white;
      background: transparent;
      font-size: 26px;
    }

    .hero {
      min-height: 650px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      right: -150px;
      top: 20px;
      background: rgba(245,158,11,.12);
      border-radius: 50%;
      filter: blur(15px);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 60px;
      position: relative;
    }

    .hero-copy {
      animation: rise .8s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    h1, h2, h3 {
      font-family: Poppins, sans-serif;
      line-height: 1.08;
    }

    h1 {
      max-width: 650px;
      font-size: clamp(42px, 6vw, 76px);
      letter-spacing: -3px;
    }

    h1 span {
      color: var(--orange);
    }

    .hero-description {
      max-width: 520px;
      margin: 24px 0 30px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: #24150a;
      background: var(--orange);
      box-shadow: 0 12px 30px rgba(245,158,11,.25);
    }

    .btn-secondary {
      color: white;
      background: transparent;
      border: 1px solid var(--border);
    }

    .btn-danger {
      color: white;
      background: var(--red);
    }

    .hero-image {
      position: relative;
      animation: appear 1s .2s ease both;
    }

    .hero-image img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 32px;
      transform: rotate(3deg);
      box-shadow: var(--shadow);
    }

    .floating-badge {
      position: absolute;
      left: -25px;
      bottom: 35px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(33,29,24,.9);
      backdrop-filter: blur(15px);
      box-shadow: var(--shadow);
      animation: float 3s ease-in-out infinite;
    }

    .section {
      padding: 90px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      font-size: clamp(30px, 4vw, 44px);
    }

    .section-heading p {
      max-width: 500px;
      color: var(--muted);
      line-height: 1.6;
    }

    .info-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: -35px;
      position: relative;
      z-index: 2;
    }

    .info-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(33,29,24,.9);
      box-shadow: var(--shadow);
    }

    .info-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .info-card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .status-open {
      color: var(--green) !important;
      font-weight: 800;
    }

    .status-closed {
      color: var(--red) !important;
      font-weight: 800;
    }

    .menu-tools {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 28px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 54px;
      padding: 0 18px 0 48px;
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: 0;
      color: white;
      background: var(--card);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 16px;
      color: var(--muted);
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .category {
      flex: 0 0 auto;
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--muted);
      background: var(--card);
      font-size: 13px;
      font-weight: 700;
    }

    .category.active,
    .category:hover {
      color: #24150a;
      background: var(--orange);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(245,158,11,.5);
      box-shadow: var(--shadow);
    }

    .product-image {
      position: relative;
      height: 220px;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .product-card:hover .product-image img {
      transform: scale(1.07);
    }

    .offer-label {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 7px 10px;
      border-radius: 9px;
      color: white;
      background: var(--red);
      font-size: 11px;
      font-weight: 900;
    }

    .unavailable-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.65);
      color: white;
      font-weight: 800;
    }

    .product-content {
      padding: 20px;
    }

    .product-category {
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-content h3 {
      margin: 8px 0;
      font-size: 20px;
    }

    .product-description {
      min-height: 44px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .price strong {
      display: block;
      color: var(--orange);
      font-size: 21px;
    }

    .old-price {
      color: #81766d;
      font-size: 12px;
      text-decoration: line-through;
    }

    .add-button {
      padding: 11px 14px;
      border-radius: 12px;
      color: #24150a;
      background: var(--orange);
      font-size: 13px;
      font-weight: 800;
    }

    .add-button:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
    }

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .about-image img {
      height: 390px;
      width: 100%;
      object-fit: cover;
      border-radius: var(--radius);
    }

    .about p {
      margin-top: 20px;
      color: var(--muted);
      line-height: 1.8;
    }

    .contact-box {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(135deg, #2a2016, #171411);
    }

    footer {
      padding: 35px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(7px);
    }

    .modal {
      width: min(600px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--bg-2);
      box-shadow: var(--shadow);
      animation: modalIn .25s ease both;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      color: white;
      background: var(--card-2);
      font-size: 20px;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-product-image {
      height: 250px;
      width: 100%;
      object-fit: cover;
      border-radius: 17px;
      margin-bottom: 20px;
    }

    .modal-body p {
      color: var(--muted);
      line-height: 1.6;
    }

    .addon-list {
      display: grid;
      gap: 10px;
      margin: 20px 0;
    }

    .addon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      font-size: 14px;
    }

    .addon label {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea, .form-input, .form-select {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: 0;
      color: white;
      background: var(--card);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .quantity button {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      color: white;
      background: var(--card-2);
      font-size: 18px;
    }

    .cart-drawer {
      position: fixed;
      z-index: 90;
      top: 0;
      right: 0;
      width: min(440px, 100%);
      height: 100vh;
      overflow-y: auto;
      background: var(--bg-2);
      box-shadow: -20px 0 50px rgba(0,0,0,.45);
      animation: drawerIn .25s ease both;
    }

    .cart-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(24,21,18,.95);
      backdrop-filter: blur(12px);
    }

    .cart-items {
      display: grid;
      gap: 13px;
      padding: 20px;
    }

    .cart-item {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--card);
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.5;
    }

    .cart-item-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 13px;
    }

    .remove {
      color: #fb7185;
      background: transparent;
      font-size: 12px;
    }

    .cart-summary {
      margin: 0 20px 20px;
      padding: 20px;
      border-radius: 16px;
      background: var(--card);
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 9px 0;
      color: var(--muted);
    }

    .summary-total {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: white;
      font-size: 19px;
      font-weight: 800;
    }

    .checkout-content {
      display: grid;
      gap: 16px;
    }

    .radio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .radio-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .radio-card:has(input:checked) {
      border-color: var(--orange);
      background: rgba(245,158,11,.1);
    }

    .radio-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .admin {
      min-height: 100vh;
      background: #f5f5f4;
      color: #1c1917;
    }

    .admin-login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #181512;
    }

    .admin-login-card {
      width: min(420px, 100%);
      padding: 30px;
      border-radius: 22px;
      background: white;
    }

    .admin-login-card h2 {
      margin-bottom: 20px;
      color: #1c1917;
    }

    .admin-login-card label {
      display: block;
      margin-top: 14px;
      color: #57534e;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-login-card input {
      width: 100%;
      margin-top: 6px;
      padding: 13px;
      border: 1px solid #d6d3d1;
      border-radius: 10px;
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
    }

    .admin-sidebar {
      padding: 25px 15px;
      color: white;
      background: #1c1917;
    }

    .admin-sidebar .logo {
      margin-bottom: 35px;
    }

    .admin-nav {
      display: grid;
      gap: 7px;
    }

    .admin-nav button {
      padding: 13px;
      border-radius: 10px;
      color: #d6d3d1;
      background: transparent;
      text-align: left;
    }

    .admin-nav button:hover,
    .admin-nav button.active {
      color: #1c1917;
      background: var(--orange);
    }

    .admin-main {
      padding: 30px;
    }

    .admin-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .admin-main h1,
    .admin-main h2,
    .admin-main h3 {
      color: #1c1917;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat {
      padding: 20px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat span {
      display: block;
      color: #78716c;
      font-size: 13px;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 30px;
    }

    .admin-panel {
      margin-top: 20px;
      padding: 22px;
      border-radius: 16px;
      background: white;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .admin-table th,
    .admin-table td {
      padding: 13px 8px;
      border-bottom: 1px solid #e7e5e4;
      text-align: left;
      font-size: 13px;
    }

    .admin-table th {
      color: #78716c;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .admin-btn {
      padding: 8px 11px;
      border-radius: 8px;
      color: white;
      background: #292524;
      font-size: 12px;
      font-weight: 700;
    }

    .admin-btn.orange {
      color: #1c1917;
      background: var(--orange);
    }

    .admin-btn.red {
      background: var(--red);
    }

    .toast {
      position: fixed;
      z-index: 200;
      right: 20px;
      bottom: 20px;
      max-width: 350px;
      padding: 15px 18px;
      border-radius: 13px;
      color: white;
      background: #292524;
      box-shadow: var(--shadow);
      animation: toastIn .25s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateX(30px) scale(.95); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(-3deg); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.94) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes drawerIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 850px) {
      .nav-links {
        position: absolute;
        display: none;
        top: 78px;
        left: 16px;
        right: 16px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #211d18;
        flex-direction: column;
        align-items: stretch;
      }

      .nav-links.open {
        display: flex;
      }

      .mobile-button {
        display: block;
      }

      .hero-grid,
      .about {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 65px 0 90px;
      }

      .hero-image {
        max-width: 600px;
        margin: auto;
      }

      .info-strip {
        grid-template-columns: 1fr;
        margin-top: 20px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .admin-layout {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        position: static;
      }

      .admin-nav {

      const old = document.querySelector(".toast");
      if (old) old.remove();

      el.className = "toast";

      document.body.appendChild(el);

      return cart.reduce((total, item) => total + item.quantity, 0);

    function cartSubtotal() {
      return cart.reduce((total, item) => {
        const addons = item.addons.reduce((sum, addon) => sum + addon.price, 0);
        return total + (item.unitPrice + addons) * item.quantity;
      }, 0);
    }

      return product.promo && product.promo < product.price

    function renderProducts() {
      const filtered = products.filter(product => {
        const matchesCategory =
          selectedCategory === "Todos" ||
          (selectedCategory === "Ofertas" ? product.offer : product.category === selectedCategory);

        const text = `${product.name} ${product.description} ${product.ingredients}`.toLowerCase();
        const matchesSearch = text.includes(searchTerm.toLowerCase());

        return matchesCategory && matchesSearch;
      });

      if (!filtered.length) {
        return `<div class="empty">Não encontramos esse produto 😕<br><small>Tente outra busca ou categoria.</small></div>`;
      }

      return filtered.map(product => {
        const discount = product.promo
          ? Math.round(((product.price - product.promo) / product.price) * 100)
          : 0;

        return `
          <article class="product-card">
            <div class="product-image">
              <img src="${product.image}" alt="${product.name}">
              ${product.offer ? `<span class="offer-label">🔥 OFERTA ${discount}% OFF</span>` : ""}
              ${!product.available ? `<div class="unavailable-label">Produto indisponível</div>` : ""}
            </div>

            <div class="product-content">
              <div class="product-category">${product.category}</div>
              <h3>${product.name}</h3>
              <p class="product-description">${product.description}</p>

              <div class="product-bottom">
                <div class="price">
                  ${product.promo ? `<span class="old-price">${money(product.price)}</span>` : ""}
                  <strong>${money(currentPrice(product))}</strong>
                </div>

                <button class="add-button"
                  ${!product.available ? "disabled" : ""}
                  onclick="openProduct(${product.id})">
                  Adicionar
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function filterCategory(category) {
      selectedCategory = category;
      document.getElementById("productsGrid").innerHTML = renderProducts();
      document.querySelectorAll(".category").forEach(button => {
        button.classList.toggle("active", button.textContent.trim() === category);
      });
    }

    function searchProducts(value) {
      searchTerm = value;

        });

      currentProduct = products.find(product => product.id === id);

      document.getElementById("overlay").innerHTML = `

              ${currentProduct.addons.length ? `

                  ${currentProduct.addons.map(addon => `

                        <input type="checkbox" value="${addon}" class="addon-check">

                      <strong>${money(addonsPrice[addon] || 0)}</strong>

                  `).join("")}

              ` : ""}

      window.modalQuantity = 1;

    function changeModalQuantity(value) {
      window.modalQuantity = Math.max(1, (window.modalQuantity || 1) + value);
      document.getElementById("modalQuantity").textContent = window.modalQuantity;
    }

    function addCurrentProduct() {
      const selectedAddons = [...document.querySelectorAll(".addon-check:checked")].map(input => ({
        name: input.value,
        price: addonsPrice[input.value] || 0
      }));

      const item = {
        cartId: Date.now(),
        productId: currentProduct.id,
        name: currentProduct.name,
        unitPrice: currentPrice(currentProduct),
        quantity: window.modalQuantity || 1,
        addons: selectedAddons,
        notes: document.getElementById("productNotes")?.value || ""
      };

      cart.push(item);
      save();
      closeOverlay();
      renderCartCount();
      toast("Produto adicionado ao carrinho 🍔");

    function renderCartCount() {
      const count = document.querySelector(".cart-count");
      if (count) count.textContent = cartCount();

                <button class="btn btn-primary" style="width:100%;margin-top:17px" onclick="openCheckout()">
                  Continuar pedido
                </button>

                <button class="btn btn-secondary" style="width:100%;margin-top:9px" onclick="clearCart()">
                  Limpar carrinho
                </button>
              </div>
            ` : ""}
          </aside>
        </div>
      `;
    }

    function renderCartItems() {
      if (!cart.length) {
        return `<div class="empty">Seu carrinho está vazio 🍔<br><small>Escolha algo delicioso no cardápio.</small></div>`;
      }

      return cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-top">
            <strong>${item.quantity}x ${item.name}</strong>
            <strong>${money((item.unitPrice + item.addons.reduce((s,a) => s+a.price,0)) * item.quantity)}</strong>
          </div>

          ${item.addons.length ? `<small>+ ${item.addons.map(addon => addon.name).join(", ")}</small>` : ""}
          ${item.notes ? `<small>Obs.: ${item.notes}</small>` : ""}

          <div class="cart-item-actions">
            <div class="quantity">
              <button onclick="updateCartQuantity(${item.cartId}, -1)">−</button>
              <strong>${item.quantity}</strong>
              <button onclick="updateCartQuantity(${item.cartId}, 1)">+</button>
            </div>

            <button class="remove" onclick="removeCartItem(${item.cartId})">Remover</button>
          </div>
        </div>
      `).join("");
    }

    function updateCartQuantity(cartId, change) {
      const item = cart.find(item => item.cartId === cartId);
      if (!item) return;

      item.quantity += change;

      if (item.quantity <= 0) {
        cart = cart.filter(item => item.cartId !== cartId);
      }

      save();
      renderCartCount();
      openCart();
    }

    function removeCartItem(cartId) {
      cart = cart.filter(item => item.cartId !== cartId);
      save();
      renderCartCount();
      openCart();
    }

    function clearCart() {
      cart = [];
      save();
      renderCartCount();
      openCart();
      toast("Carrinho limpo");
    }

              </div>

                </div>
              </div>

              <div id="addressFields">
                <div class="form-group">
                  <label>Endereço</label>
                  <input class="form-input" id="address" placeholder="Rua ou avenida">
                </div>

                <div class="form-group">
                  <label>Número</label>
                  <input class="form-input" id="addressNumber" placeholder="Número">
                </div>

                <div class="form-group">
                  <label>Bairro</label>
                  <input class="form-input" id="neighborhood" placeholder="Bairro">
                </div>

                <div class="form-group">
                  <label>Ponto de referência</label>
                  <input class="form-input" id="reference" placeholder="Ponto de referência">
                </div>
              </div>

              <div class="form-group">
                <label>Forma de pagamento</label>
                <select class="form-select" id="payment" onchange="toggleChange()">
                  <option value="PIX">PIX</option>
                  <option value="Dinheiro">Dinheiro</option>
                  <option value="Cartão de crédito">Cartão de crédito</option>
                  <option value="Cartão de débito">Cartão de débito</option>
                </select>
              </div>

              <div class="form-group hidden" id="changeGroup">
                <label>Troco para quanto?</label>
                <input class="form-input" id="changeFor" type="number" placeholder="Ex.: 50">
              </div>

              <div class="form-group">
                <label>Observações gerais</label>
                <textarea id="orderNotes" placeholder="Alguma observação sobre o pedido?"></textarea>
              </div>

              <div class="cart-summary" style="margin:0">
                <div class="summary-line"><span>Subtotal</span><strong>${money(cartSubtotal())}</strong></div>
                <div class="summary-line"><span>Entrega</span><strong>${money(DELIVERY_FEE)}</strong></div>
                <div class="summary-line summary-total"><span>Total</span><strong>${money(cartSubtotal() + DELIVERY_FEE)}</strong></div>
              </div>

              <button class="btn btn-primary" style="width:100%" onclick="submitOrder()">
                📲 Enviar pedido pelo WhatsApp
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleAddress(show) {
      document.getElementById("addressFields").classList.toggle("hidden", !show);
      checkoutDelivery = show ? "DELIVERY" : "PICKUP";
    }

    function toggleChange() {
      const payment = document.getElementById("payment").value;
      document.getElementById("changeGroup").classList.toggle("hidden", payment !== "Dinheiro");
    }

    function submitOrder() {
      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const delivery = document.querySelector("input[name='delivery']:checked").value;
      const payment = document.getElementById("payment").value;

      if (!name || !phone) {
        toast("Informe seu nome e telefone");
        return;
      }

      if (delivery === "DELIVERY") {
        const address = document.getElementById("address").value.trim();
        const number = document.getElementById("addressNumber").value.trim();
        const neighborhood = document.getElementById("neighborhood").value.trim();

        if (!address || !number || !neighborhood) {
          toast("Preencha os dados de entrega");
          return;
        }
      }

      const order = {
        number: orders.length + 1,
        createdAt: new Date().toLocaleString("pt-BR"),
        name,
        phone,
        delivery,
        payment,
        address: document.getElementById("address")?.value || "",
        addressNumber: document.getElementById("addressNumber")?.value || "",
        neighborhood: document.getElementById("neighborhood")?.value || "",
        reference: document.getElementById("reference")?.value || "",
        changeFor: document.getElementById("changeFor")?.value || "",
        notes: document.getElementById("orderNotes").value || "",
        items: [...cart],
        subtotal: cartSubtotal(),
        deliveryFee: delivery === "DELIVERY" ? DELIVERY_FEE : 0,
        total: cartSubtotal() + (delivery === "DELIVERY" ? DELIVERY_FEE : 0),
        status: "Novo"
      };

      orders.push(order);
      save();

      const message = createWhatsAppMessage(order);
      const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`;

      cart = [];
      save();
      renderCartCount();
      closeOverlay();
      toast("Pedido criado! Abrindo WhatsApp...");
      window.open(url, "_blank");
    }

    function createWhatsAppMessage(order) {
      let message = `🍔 *NOVO PEDIDO — DESU BURGUER*\\n\\n`;
      message += `*Pedido:* #${order.number}\\n`;
      message += `*Cliente:* ${order.name}\\n`;
      message += `*Telefone:* ${order.phone}\\n\\n`;
      message += `*PEDIDO:*\\n`;

      order.items.forEach(item => {
        message += `\\n${item.quantity}x ${item.name}\\n`;

        item.addons.forEach(addon => {
          message += `+ ${addon.name}\\n`;
        });

        if (item.notes) {
          message += `Obs.: ${item.notes}\\n`;
        }
      });

      message += `\\n*Subtotal:* ${money(order.subtotal)}`;
      message += `\\n*Entrega:* ${money(order.deliveryFee)}`;
      message += `\\n*TOTAL:* ${money(order.total)}`;
      message += `\\n*Pagamento:* ${order.payment}`;

      if (order.changeFor) {
        message += `\\n*Troco para:* ${money(order.changeFor)}`;
      }

      if (order.delivery === "DELIVERY") {
        message += `\\n\\n*Endereço:* ${order.address}, ${order.addressNumber}`;
        message += `\\n*Bairro:* ${order.neighborhood}`;

        if (order.reference) {
          message += `\\n*Referência:* ${order.reference}`;
        }
      } else {
        message += `\\n\\n*Forma:* Retirada no local`;
      }

      if (order.notes) {
        message += `\\n\\n*Observações:* ${order.notes}`;
      }

      return message;
    }

    function closeOverlay(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById("overlay").innerHTML = "";
    }

    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("open");
    }

    function closeMenu() {
      document.getElementById("navLinks")?.classList.remove("open");
    }

    function openAdminLogin() {
      document.getElementById("app").innerHTML = `
        <div class="admin-login">
          <form class="admin-login-card" onsubmit="adminLogin(event)">
            <div class="logo" style="color:#1c1917;margin-bottom:25px">
              <span class="logo-icon">🍔</span>
              Desu Burguer
            </div>

            <h2>Painel administrativo</h2>

            <label>E-mail</label>
            <input id="adminEmail" type="email" required placeholder="admin@desuburguer.com">

            <label>Senha</label>
            <input id="adminPassword" type="password" required placeholder="Digite sua senha">

            <button class="btn btn-primary" style="width:100%;margin-top:20px">
              Entrar
            </button>

            <button type="button" class="btn btn-secondary" style="width:100%;margin-top:10px;color:#1c1917" onclick="renderSite()">
              Voltar para o site
            </button>
          </form>
        </div>
      `;
    }

    function adminLogin(event) {
      event.preventDefault();

      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        sessionStorage.setItem("desu_admin", "true");
        renderAdmin();
      } else {
        toast("E-mail ou senha inválidos");
      }
    }

    function renderAdmin() {
      if (sessionStorage.getItem("desu_admin") !== "true") {
        openAdminLogin();
        return;
      }

      document.getElementById("app").innerHTML = `
        <div class="admin">
          <div class="admin-layout">
            <aside class="admin-sidebar">
              <div class="logo">
                <span class="logo-icon">🍔</span>
                Desu Burguer
              </div>

              <nav class="admin-nav">
                <button class="active" onclick="adminSection('dashboard')">📊 Dashboard</button>
                <button onclick="adminSection('products')">🍔 Produtos</button>
                <button onclick="adminSection('orders')">🧾 Pedidos</button>
                <button onclick="adminSection('settings')">⚙️ Configurações</button>
                <button onclick="sessionStorage.removeItem('desu_admin');renderSite()">↩️ Sair</button>
              </nav>
            </aside>

            <main class="admin-main" id="adminContent"></main>
          </div>
        </div>
      `;

      adminSection("dashboard");
    }

    function adminSection(section) {
      const content = document.getElementById("adminContent");

      if (section === "dashboard") {
        content.innerHTML = `
          <div class="admin-top">
            <div>
              <h1>Dashboard</h1>
              <p style="color:#78716c;margin-top:6px">Visão geral da Desu Burguer</p>
            </div>
            <button class="admin-btn orange" onclick="renderSite()">Ver site</button>
          </div>

          <div class="stats">
            <div class="stat"><span>Produtos cadastrados</span><strong>${products.length}</strong></div>
            <div class="stat"><span>Disponíveis</span><strong>${products.filter(p => p.available).length}</strong></div>
            <div class="stat"><span>Em oferta</span><strong>${products.filter(p => p.offer).length}</strong></div>
            <div class="stat"><span>Pedidos</span><strong>${orders.length}</strong></div>
          </div>

          <div class="admin-panel">
            <h2>Últimos pedidos</h2>
            ${orders.length ? `
              <table class="admin-table">
                <thead><tr><th>#</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead>
                <tbody>
                  ${orders.slice(-8).reverse().map(order => `
                    <tr>
                      <td>#${order.number}</td>
                      <td>${order.name}</td>
                      <td>${money(order.total)}</td>
                      <td>${order.status}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            ` : `<p style="color:#78716c;margin-top:15px">Nenhum pedido recebido ainda.</p>`}
          </div>
        `;
      }

      if (section === "products") {
        content.innerHTML = `
          <div class="admin-top">
            <div>
              <h1>Produtos</h1>
              <p style="color:#78716c;margin-top:6px">Gerencie o cardápio da hamburgueria</p>
            </div>
            <button class="admin-btn orange" onclick="newProduct()">+ Adicionar produto</button>
          </div>

          <div class="admin-panel">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Produto</th>
                  <th>Categoria</th>
                  <th>Preço</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${products.map(product => `
                  <tr>
                    <td><strong>${product.name}</strong></td>
                    <td>${product.category}</td>
                    <td>${money(currentPrice(product))}</td>
                    <td>${product.available ? "🟢 Disponível" : "🔴 Indisponível"}</td>
                    <td>
                      <div class="admin-actions">
                        <button class="admin-btn orange" onclick="editProduct(${product.id})">Editar</button>
                        <button class="admin-btn" onclick="toggleProduct(${product.id})">
                          ${product.available ? "Desativar" : "Ativar"}
                        </button>
                        <button class="admin-btn red" onclick="deleteProduct(${product.id})">Excluir</button>
                      </div>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      if (section === "orders") {
        content.innerHTML = `
          <div class="admin-top">
            <div>
              <h1>Pedidos</h1>
              <p style="color:#78716c;margin-top:6px">Acompanhe os pedidos recebidos</p>
            </div>
          </div>

          <div class="admin-panel">
            ${orders.length ? `
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody>
                  ${orders.slice().reverse().map(order => `
                    <tr>
                      <td>#${order.number}</td>
                      <td>${order.name}<br><small>${order.phone}</small></td>
                      <td>${order.createdAt}</td>
                      <td>${money(order.total)}</td>
                      <td>${order.status}</td>
                      <td>
                        <select class="form-select" onchange="changeOrderStatus(${order.number}, this.value)">
                          ${["Novo","Em preparação","Pronto","Saiu para entrega","Finalizado","Cancelado"].map(status => `
                            <option ${order.status === status ? "selected" : ""}>${status}</option>
                          `).join("")}
                        </select>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            ` : `<p style="color:#78716c">Nenhum pedido cadastrado.</p>`}
          </div>
        `;
      }

      if (section === "settings") {
        content.innerHTML = `
          <div class="admin-top">
            <div>
              <h1>Configurações</h1>
              <p style="color:#78716c;margin-top:6px">Informações da loja</p>
            </div>
          </div>

          <div class="admin-panel">
            <div class="form-group">
              <label>Nome da hamburgueria</label>
              <input class="form-input" value="Desu Burguer">
            </div>

            <div class="form-group">
              <label>WhatsApp</label>
              <input class="form-input" value="(89) 98150-1360">
            </div>

            <div class="form-group">
              <label>Endereço</label>
              <input class="form-input" value="Avenida David Campos, 1499, Cristino Castro - PI">
            </div>

            <div class="form-group">
              <label>Taxa de entrega</label>
              <input class="form-input" value="${DELIVERY_FEE}" type="number">
            </div>

            <button class="admin-btn orange" onclick="toast('Configurações salvas neste protótipo')">
              Salvar configurações
            </button>
          </div>
        `;
      }
    }

    function newProduct() {
      const name = prompt("Nome do produto:");
      if (!name) return;

      const price = Number(prompt("Preço:") || 0);
      const category = prompt("Categoria:", "Hambúrgueres") || "Hambúrgueres";

      products.push({
        id: Date.now(),
        name,
        category,
        description: "Produto artesanal Desu Burguer.",
        ingredients: "Ingredientes selecionados",
        price,
        promo: null,
        offer: false,
        available: true,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85",
        addons: ["Bacon extra", "Queijo extra"]
      });

      save();
      adminSection("products");
      toast("Produto cadastrado");
    }

    function editProduct(id) {
      const product = products.find(product => product.id === id);
      if (!product) return;

      const name = prompt("Nome do produto:", product.name);
      if (!name) return;

      const price = Number(prompt("Preço:", product.price) || product.price);
      const promo = prompt("Preço promocional ou deixe vazio:", product.promo || "");

      product.name = name;
      product.price = price;
      product.promo = promo ? Number(promo) : null;
      product.offer = Boolean(product.promo);

      save();
      adminSection("products");
      toast("Produto atualizado");
    }

    function toggleProduct(id) {
      const product = products.find(product => product.id === id);
      if (!product) return;

      product.available = !product.available;
      save();
      adminSection("products");
      toast("Disponibilidade atualizada");
    }

    function deleteProduct(id) {
      if (!confirm("Deseja realmente excluir este produto?")) return;

      products = products.filter(product => product.id !== id);
      save();
      adminSection("products");
      toast("Produto excluído");
    }

    function changeOrderStatus(number, status) {
      const order = orders.find(order => order.number === number);
      if (!order) return;

      order.status = status;
      save();
      toast("Status atualizado");
    }

    window.filterCategory = filterCategory;
    window.searchProducts = searchProducts;
    window.showOffers = showOffers;
    window.openProduct = openProduct;
    window.changeModalQuantity = changeModalQuantity;
    window.addCurrentProduct = addCurrentProduct;
    window.openCart = openCart;
    window.updateCartQuantity = updateCartQuantity;
    window.removeCartItem = removeCartItem;
    window.clearCart = clearCart;
    window.openCheckout = openCheckout;
    window.toggleAddress = toggleAddress;
    window.toggleChange = toggleChange;
    window.submitOrder = submitOrder;
    window.closeOverlay = closeOverlay;
    window.toggleMenu = toggleMenu;
    window.closeMenu = closeMenu;
    window.adminLogin = adminLogin;
    window.renderSite = renderSite;
    window.renderAdmin = renderAdmin;
    window.adminSection = adminSection;
    window.newProduct = newProduct;
    window.editProduct = editProduct;
    window.toggleProduct = toggleProduct;
    window.deleteProduct = deleteProduct;
    window.changeOrderStatus = changeOrderStatus;

    renderSite();

    // Acesso demonstrativo ao painel:
    // http://localhost:...?admin
    if (location.hash === "#admin") {
      openAdminLogin();
    }
  </script>
</body>
</html>
